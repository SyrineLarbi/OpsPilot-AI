<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion · OpsPilot</title>
<style>
  :root { --bg: #f4f5f9; --surface: #fff; --line: #e5e7ef; --text: #141627; --muted: #646a85; --brand: #4f46e5; --bad: #dc2626; --bad-soft: #fdecec; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0e1020; --surface: #171a2e; --line: #2a2f4a; --text: #eceef8; --muted: #9da3c4; --brand: #8b85ff; --bad: #f87171; --bad-soft: #3a1a1d; }
  }
  :root[data-theme="dark"] { --bg: #0e1020; --surface: #171a2e; --line: #2a2f4a; --text: #eceef8; --muted: #9da3c4; --brand: #8b85ff; --bad: #f87171; --bad-soft: #3a1a1d; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--text);
         font: 14px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif; }
  .card { width: min(400px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 30px 28px; box-shadow: 0 8px 30px rgba(20,22,39,.08); }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; margin-bottom: 22px; }
  .logo { width: 32px; height: 32px; border-radius: 9px; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 800; }
  h1 { font-size: 21px; margin: 0 0 4px; } p { color: var(--muted); margin: 0 0 22px; }
  label { display: block; font-weight: 600; font-size: 13px; margin: 14px 0 6px; }
  input { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--text); font: inherit; }
  input:focus { outline: 2px solid var(--brand); outline-offset: 1px; border-color: transparent; }
  button { width: 100%; margin-top: 22px; padding: 12px; border: 0; border-radius: 10px; background: var(--brand); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .error { display: none; margin-top: 16px; padding: 10px 12px; border-radius: 10px; background: var(--bad-soft); color: var(--bad); font-size: 13px; }
  .foot { text-align: center; color: var(--muted); font-size: 12px; margin-top: 18px; }
</style>
</head>
<body>
<form class="card" id="form" autocomplete="on">
  <div class="brand"><div class="logo">O</div>OpsPilot AI</div>
  <h1>Connexion</h1>
  <p>Automatisation des factures fournisseurs</p>
  <label for="email">Adresse e-mail</label>
  <input id="email" name="email" type="email" autocomplete="username" required autofocus>
  <label for="password">Mot de passe</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button id="submit" type="submit">Se connecter</button>
  <div class="error" id="error" role="alert"></div>
  <div class="foot">Application locale · vos données restent sur vos serveurs</div>
</form>
<script>
  const form = document.getElementById('form'), err = document.getElementById('error'), btn = document.getElementById('submit');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true; err.style.display = 'none';
    try {
      const res = await fetch('/api/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'x-opspilot': '1' },
        body: JSON.stringify({ email: form.email.value, password: form.password.value }),
      });
      if (res.ok) { location.href = '/'; return; }
      err.textContent = (await res.json()).error || 'Connexion impossible.';
    } catch { err.textContent = 'Serveur injoignable.'; }
    err.style.display = 'block'; btn.disabled = false; form.password.select();
  });
</script>
</body>
</html>
