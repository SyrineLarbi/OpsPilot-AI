        &lt;div class=&quot;arrow&quot;&gt;→&lt;/div&gt;

  &lt;!-- 11. Principles --&gt;
  &lt;section class=&quot;slide&quot;&gt;

      &lt;h2&gt;Reliable before clever&lt;/h2&gt;
      &lt;div class=&quot;grid g2&quot; style=&quot;margin-top:20px&quot;&gt;

    --ok: #34d399; --ok-soft: #0f3326; --bad: #f87171; --bad-soft: #3b1a1d;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 76px; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: Inter, system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif; line-height: 1.6; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
  a { color: var(--brand); }

  /* top nav */
  .top { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .top .wrap { display: flex; align-items: center; gap: 16px; height: 60px; }
  .brand { font-weight: 700; display: flex; align-items: center; gap: 8px; white-space: nowrap; text-decoration: none; color: var(--text); }
  .logo { width: 24px; height: 24px; border-radius: 7px; background: var(--brand); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 800; }
  .links { display: flex; gap: 4px; overflow-x: auto; flex: 1; scrollbar-width: none; }
  .links a { text-decoration: none; color: var(--muted); font-size: 14px; font-weight: 500; padding: 6px 10px; border-radius: 8px; white-space: nowrap; }
  .links a:hover, .links a.on { background: var(--surface-2); color: var(--text); }
  .tbtn { background: var(--surface); border: 1px solid var(--line); color: var(--text); border-radius: 9px; height: 34px; width: 34px; cursor: pointer; flex: 0 0 auto; }

  /* hero */
  header.hero { padding: 64px 0 36px; }
  .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--brand); margin: 0 0 12px; }
  h1 { font-size: clamp(34px, 5.5vw, 56px); line-height: 1.05; letter-spacing: -.03em; margin: 0 0 16px; }
  .lead { font-size: clamp(17px, 2vw, 20px); color: var(--muted); max-width: 720px; margin: 0; }

  h2 { font-size: clamp(26px, 3.6vw, 38px); letter-spacing: -.02em; line-height: 1.12; margin: 0 0 10px; }
  h3 { font-size: 20px; letter-spacing: -.01em; margin: 36px 0 12px; }
  h4 { font-size: 16px; margin: 0 0 6px; }
  section.svc { padding: 56px 0 24px; border-top: 1px solid var(--line); }
  .muted { color: var(--muted); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; box-shadow: var(--shadow); }
  .grid { display: grid; gap: 14px; }
  .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  @media (max-width: 820px) { .g3 { grid-template-columns: 1fr; } }
  @media (max-width: 640px) { .g2 { grid-template-columns: 1fr; } }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 0; }
  .chip { font-size: 13px; padding: 5px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }

  .svc-head { display: flex; gap: 16px; align-items: flex-start; }
  .svc-icon { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; font-size: 26px; flex: 0 0 auto; background: var(--accent-soft); }
  .auto { --accent: var(--c-auto); --accent-soft: var(--c-auto-soft); }
  .tool { --accent: var(--c-tool); --accent-soft: var(--c-tool-soft); }
  .data { --accent: var(--c-data); --accent-soft: var(--c-data-soft); }
  .svc .eyebrow { color: var(--accent); }

  /* steps */
  .steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; counter-reset: st; }
  .steps .card { padding: 16px; border-top: 3px solid var(--accent); counter-increment: st; }
  .steps .card::before { content: &quot;Step &quot; counter(st); display: block; font-size: 12px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
  .steps p { margin: 0; color: var(--muted); font-size: 14.5px; }
  html[lang=&quot;fr&quot;] .steps .card::before { content: &quot;Étape &quot; counter(st); }

  /* problems */
  .problems { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 8px 20px; }
  .problems li { padding-left: 26px; position: relative; }
  .problems li::before { content: &quot;✕&quot;; position: absolute; left: 0; color: var(--bad); font-weight: 700; }
  .check { list-style: none; padding: 0; margin: 0; }
  .check li { padding-left: 26px; position: relative; margin: 6px 0; }
  .check li::before { content: &quot;✓&quot;; position: absolute; left: 0; color: var(--ok); font-weight: 700; }

  /* example story */
  .story { background: var(--accent-soft); border-radius: 16px; padding: 22px; margin-top: 8px; }
  .story &gt; p:first-child { margin-top: 0; }
  .story .label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); }
  .ba { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
  @media (max-width: 640px) { .ba { grid-template-columns: 1fr; } }
  .ba .card { box-shadow: none; }
  .ba .before h4 { color: var(--bad); } .ba .after h4 { color: var(--ok); }
  .ba ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); font-size: 14.5px; }

  /* tables */
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12.5px; color: var(--muted); font-weight: 600; background: var(--surface-2); white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  .mono { font-family: &quot;JetBrains Mono&quot;, ui-monospace, monospace; font-size: 12.5px; }
  .nowrap { white-space: nowrap; }
  .r { text-align: right; font-variant-numeric: tabular-nums; }
  tr.bad td { background: var(--bad-soft); }
  td.bad, .bad-t { color: var(--bad); font-weight: 600; }
  .ok-t { color: var(--ok); font-weight: 600; }
  .caption { font-size: 13px; color: var(--muted); margin: 8px 2px 0; }

  pre.out { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; overflow-x: auto; font-family: &quot;JetBrains Mono&quot;, ui-monospace, monospace; font-size: 12.5px; line-height: 1.6; margin: 0; white-space: pre; }

  /* more examples */
  .ex .card h4 { display: flex; gap: 8px; align-items: center; }
  .ex dl { margin: 10px 0 0; display: grid; grid-template-columns: 74px 1fr; gap: 4px 8px; font-size: 14px; }
  .ex dt { color: var(--accent); font-weight: 600; font-size: 12.5px; text-transform: uppercase; letter-spacing: .04em; padding-top: 2px; }
  .ex dd { margin: 0; color: var(--muted); }

  .pkg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  @media (max-width: 820px) { .pkg { grid-template-columns: 1fr; } }
  .pkg .card h4 { color: var(--accent); }
  .pkg ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); font-size: 14.5px; }

  /* overview table */
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; vertical-align: middle; }

  /* timeline */
  .tl { position: relative; margin: 10px 0 0; padding-left: 26px; }
  .tl::before { content: &quot;&quot;; position: absolute; left: 7px; top: 6px; bottom: 6px; width: 2px; background: var(--line); }
  .tl-item { position: relative; margin-bottom: 18px; }
  .tl-item::before { content: &quot;&quot;; position: absolute; left: -25px; top: 6px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); border: 3px solid var(--c, var(--brand)); }
  .tl-item b { display: block; }
  .tl-item span { color: var(--muted); font-size: 14.5px; }

  details { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; margin-bottom: 10px; }
  summary { cursor: pointer; font-weight: 600; }
  details p { margin: 10px 0 0; color: var(--muted); }

  .cta { margin: 56px 0; text-align: center; padding: 44px 20px; border-radius: 20px; background: var(--brand-soft); }
  .cta h2 { margin-bottom: 10px; }
  .btn { display: inline-block; background: var(--brand); color: #fff; text-decoration: none; padding: 13px 22px; border-radius: 12px; font-weight: 600; margin: 6px; }
  .btn.ghost { background: var(--surface); color: var(--text); border: 1px solid var(--line); }
  .note { font-size: 13px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 12px; margin: 14px 0 0; }
  footer { padding: 24px 0 48px; color: var(--muted); font-size: 13px; text-align: center; }
&lt;/style&gt;
&lt;/head&gt;

&lt;!-- ================= OVERVIEW ================= --&gt;

      &lt;tr&gt;&lt;td&gt;&lt;b&gt;Solves&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Repetitive data entry and copy-paste between systems&lt;/td&gt;&lt;td&gt;Processes run in Excel files, emails and paper&lt;/td&gt;&lt;td&gt;Not knowing what is really happening in the numbers&lt;/td&gt;&lt;/tr&gt;

&lt;!-- ================= AUTOMATION ================= --&gt;
&lt;section class=&quot;svc auto&quot; id=&quot;automation&quot;&gt;
  &lt;div class=&quot;svc-head&quot;&gt;
    &lt;div class=&quot;svc-icon&quot;&gt;⚙️&lt;/div&gt;
    &lt;div&gt;
      &lt;p class=&quot;eyebrow&quot;&gt;Service 1&lt;/p&gt;
      &lt;h2&gt;Automation&lt;/h2&gt;
      &lt;p class=&quot;muted&quot; style=&quot;margin:0&quot;&gt;Connect your apps and remove repetitive workflows. Information arrives, gets checked against your rules, lands in the right place, and the right person is told what needs attention.&lt;/p&gt;
      &lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;Supplier invoices&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Order emails&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;CSV / Excel imports&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Price lists&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;Alerts &amp;amp; reminders&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Problems it solves&lt;/h3&gt;
  &lt;ul class=&quot;problems&quot;&gt;
    &lt;li&gt;The same data typed twice: from a PDF or email into Excel, then into the accounting software&lt;/li&gt;
    &lt;li&gt;Errors found weeks later, such as wrong VAT, duplicate invoices or totals that don&#x27;t add up&lt;/li&gt;
    &lt;li&gt;Staff time lost on copy-paste instead of supplier and customer follow-up&lt;/li&gt;
    &lt;li&gt;Nobody is alerted when something goes wrong, so problems pile up silently&lt;/li&gt;
  &lt;/ul&gt;

  &lt;h3&gt;How it works&lt;/h3&gt;
  &lt;div class=&quot;steps&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Receive&lt;/h4&gt;&lt;p&gt;Files dropped in a folder, email attachments, or exports from another system.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Extract&lt;/h4&gt;&lt;p&gt;Read the fields. For scanned documents, optional OCR or a local AI model suggests the values.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Validate&lt;/h4&gt;&lt;p&gt;Your business rules check every record: dates, VAT, totals, currencies, mandatory fields, duplicates.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Save&lt;/h4&gt;&lt;p&gt;Valid records go to the database or your application. Invalid ones are quarantined with a reason.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h4&gt;Notify&lt;/h4&gt;&lt;p&gt;A summary by email or Telegram: how many were processed, and exactly what needs a person.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;h3&gt;Worked example: supplier invoice processing&lt;/h3&gt;
  &lt;div class=&quot;story&quot;&gt;
    &lt;p&gt;&lt;span class=&quot;label&quot;&gt;The situation&lt;/span&gt;&lt;br&gt;
    &lt;b&gt;Medina Food Distribution&lt;/b&gt; (fictional, 45 employees) receives about &lt;b&gt;300 supplier invoices a month&lt;/b&gt; from 25 suppliers. An accounting assistant types each one into a spreadsheet, checks the VAT with a calculator, then enters it again into the accounting software.&lt;/p&gt;

    &lt;div class=&quot;ba&quot;&gt;
      &lt;div class=&quot;card before&quot;&gt;&lt;h4&gt;Before&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;~4 minutes per invoice → about 20 hours a month&lt;/li&gt;&lt;li&gt;Errors noticed at month-end closing&lt;/li&gt;&lt;li&gt;Duplicate invoices sometimes paid twice&lt;/li&gt;&lt;li&gt;No record of what was checked&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
      &lt;div class=&quot;card after&quot;&gt;&lt;h4&gt;After&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;Suppliers&#x27; files are processed as soon as they arrive&lt;/li&gt;&lt;li&gt;Only rejected rows need a person: about 2 hours a month&lt;/li&gt;&lt;li&gt;Duplicates blocked automatically&lt;/li&gt;&lt;li&gt;Every run is logged with counts and reasons&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;h4 style=&quot;margin-top:24px&quot;&gt;1 · The file that arrives (extract)&lt;/h4&gt;
  &lt;div class=&quot;scroll&quot;&gt;
    &lt;table class=&quot;mono&quot;&gt;
      &lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th&gt;invoice_number&lt;/th&gt;&lt;th&gt;supplier&lt;/th&gt;&lt;th&gt;invoice_date&lt;/th&gt;&lt;th&gt;due_date&lt;/th&gt;&lt;th class=&quot;r&quot;&gt;amount_ht&lt;/th&gt;&lt;th class=&quot;r&quot;&gt;vat&lt;/th&gt;&lt;th class=&quot;r&quot;&gt;vat_amount&lt;/th&gt;&lt;th class=&quot;r&quot;&gt;amount_ttc&lt;/th&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;INV-2026-00001&lt;/td&gt;&lt;td&gt;Atlas Cleaning&lt;/td&gt;&lt;td&gt;2026-06-19&lt;/td&gt;&lt;td&gt;2026-07-19&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;24,275.399&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;19&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;4,612.326&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;28,887.725&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;INV-2026-00002&lt;/td&gt;&lt;td&gt;Atlas Cleaning&lt;/td&gt;&lt;td&gt;2026-05-26&lt;/td&gt;&lt;td&gt;2026-06-25&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;11,435.509&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;7&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;800.486&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;12,285.995&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;bad&quot;&gt;&lt;td&gt;9&lt;/td&gt;&lt;td&gt;INV-2026-00008&lt;/td&gt;&lt;td&gt;Sahel Packaging&lt;/td&gt;&lt;td class=&quot;bad&quot;&gt;31/02/2026&lt;/td&gt;&lt;td&gt;2026-03-30&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;3,120.000&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;19&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;592.800&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;3,712.800&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;bad&quot;&gt;&lt;td&gt;17&lt;/td&gt;&lt;td&gt;INV-2026-00016&lt;/td&gt;&lt;td&gt;Cap Bon Beverages&lt;/td&gt;&lt;td&gt;2026-04-02&lt;/td&gt;&lt;td&gt;2026-05-17&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;8,400.000&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;13&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;1,092.000&lt;/td&gt;&lt;td class=&quot;r bad&quot;&gt;9,542.000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;bad&quot;&gt;&lt;td&gt;33&lt;/td&gt;&lt;td&gt;INV-2026-00032&lt;/td&gt;&lt;td&gt;Carthage Logistics&lt;/td&gt;&lt;td&gt;2026-07-11&lt;/td&gt;&lt;td class=&quot;bad&quot;&gt;2025-01-01&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;1,000.000&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;19&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;190.000&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;1,190.000&lt;/td&gt;&lt;/tr&gt;
      &lt;tr class=&quot;bad&quot;&gt;&lt;td&gt;52&lt;/td&gt;&lt;td&gt;INV-2026-00001&lt;/td&gt;&lt;td&gt;Atlas Cleaning&lt;/td&gt;&lt;td&gt;2026-06-19&lt;/td&gt;&lt;td&gt;2026-07-19&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;24,275.399&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;19&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;4,612.326&lt;/td&gt;&lt;td class=&quot;r&quot;&gt;28,887.725&lt;/td&gt;&lt;/tr&gt;
    &lt;/table&gt;
  &lt;/div&gt;
  &lt;p class=&quot;caption&quot;&gt;Highlighted rows contain problems a busy person can easily miss: an impossible date, a total that is 50 TND too high, a due date before the invoice date, and an invoice sent twice.&lt;/p&gt;

  &lt;h4 style=&quot;margin-top:24px&quot;&gt;2 · The rules that check it&lt;/h4&gt;
  &lt;div class=&quot;scroll&quot;&gt;

      &lt;div class=&quot;card before&quot;&gt;&lt;h4&gt;Before&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;Two days of Excel work every month&lt;/li&gt;&lt;li&gt;Duplicates and typing errors inflate the figures&lt;/li&gt;&lt;li&gt;The report shows totals, not problems&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;

  });

  /* ---------- bridge: lets index.html switch pages and keep language/theme in sync ---------- */
  (function () {
    if (window.parent === window) return;
    document.documentElement.classList.add(&#x27;embedded&#x27;);
    document.head.insertAdjacentHTML(&#x27;beforeend&#x27;, &#x27;&lt;style&gt;.embedded .nav .brand, .embedded .top .brand { display: none; }&lt;/style&gt;&#x27;);
    const PAGES = { &#x27;presentation.html&#x27;: &#x27;presentation&#x27;, &#x27;services.html&#x27;: &#x27;services&#x27; };
    document.addEventListener(&#x27;click&#x27;, (e) =&gt; {
      const a = e.target.closest(&#x27;a[href]&#x27;);
      if (!a) return;
      const href = a.getAttribute(&#x27;href&#x27;);
      const page = PAGES[href.split(/[?#]/)[0]];
      if (page) {
        e.preventDefault();
        parent.postMessage({ type: &#x27;opspilot-open&#x27;, page }, &#x27;*&#x27;);
      } else if (href.length &gt; 1 &amp;&amp; href.startsWith(&#x27;#&#x27;)) {
        const target = document.getElementById(href.slice(1));
        if (target) { e.preventDefault(); target.scrollIntoView({ behavior: &#x27;smooth&#x27; }); }

    const root = document.documentElement;
    let lastTheme = root.dataset.theme;
    new MutationObserver(() =&gt; {
      if (root.dataset.theme === lastTheme) return;
      lastTheme = root.dataset.theme;
      parent.postMessage({ type: &#x27;opspilot-theme&#x27;, theme: lastTheme }, &#x27;*&#x27;);
    }).observe(root, { attributes: true, attributeFilter: [&#x27;data-theme&#x27;] });

        root.dataset.theme = d.theme;

    if (root.dataset.theme) parent.postMessage({ type: &#x27;opspilot-theme&#x27;, theme: root.dataset.theme }, &#x27;*&#x27;);

<script>
  const frames = { presentation: document.getElementById('f-presentation'), services: document.getElementById('f-services') };
  const tabs = [...document.querySelectorAll('.tab')];
  const root = document.documentElement;
  let lang = 'en';

  function show(page, focus = true) {
    if (!frames[page]) page = 'presentation';
    Object.entries(frames).forEach(([name, f]) => { f.hidden = name !== page; });
    tabs.forEach((t) => t.setAttribute('aria-selected', String(t.dataset.page === page)));
    try { history.replaceState(null, '', '#' + page); } catch (e) {}
    if (focus) frames[page].contentWindow.focus();
  }

  function applyLang(l) {
    lang = l === 'fr' ? 'fr' : 'en';
    root.lang = lang;
    document.querySelectorAll('[data-en]').forEach((el) => { el.textContent = el.dataset[lang]; });
    document.title = lang === 'fr' ? 'OpsPilot AI · Présentation & services' : 'OpsPilot AI · Presentation & services';
  }

  function broadcast(msg, except) {
    Object.values(frames).forEach((f) => { if (f.contentWindow !== except) f.contentWindow.postMessage(msg, '*'); });
  }

  addEventListener('message', (e) => {
    const d = e.data || {};
    if (d.type === 'opspilot-open') show(d.page);
    if (d.type === 'opspilot-lang') { applyLang(d.lang); broadcast({ type: 'opspilot-set-lang', lang: d.lang }, e.source); }
    if (d.type === 'opspilot-theme') { root.dataset.theme = d.theme; broadcast({ type: 'opspilot-set-theme', theme: d.theme }, e.source); }
  });

  tabs.forEach((t) => { t.onclick = () => show(t.dataset.page); });
  document.querySelector('.tabs').addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    const i = tabs.findIndex((t) => t.getAttribute('aria-selected') === 'true');
    const next = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];
    show(next.dataset.page, false);
    next.focus();
  });

  // ?lang=fr or ?lang=en forces the language for both pages
  const forced = new URLSearchParams(location.search).get('lang');
  if (forced) {
    applyLang(forced);
    Object.values(frames).forEach((f) => f.addEventListener('load', () => f.contentWindow.postMessage({ type: 'opspilot-set-lang', lang: forced }, '*')));
  }
  show(location.hash.slice(1) || 'presentation', false);
  frames.presentation.addEventListener('load', () => { if (!frames.presentation.hidden) frames.presentation.contentWindow.focus(); });
</script>
